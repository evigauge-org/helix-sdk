name: Bug report
description: Something in the SDK does not behave as documented
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        For anything security-related, **do not file an issue** — email
        info@evigauge.com. See SECURITY.md.
  - type: dropdown
    id: sdk
    attributes:
      label: Which SDK?
      options:
        - "TypeScript (@helixsdk/core)"
        - "Python (helix-protocol)"
        - "Both"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SDK version
      placeholder: "0.1.0-alpha.0"
    validations:
      required: true
  - type: input
    id: protocol
    attributes:
      label: Protocol version
      description: The value of PROTOCOL_VERSION your client negotiated.
      placeholder: "aep-2026-04-24"
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime version
      description: Node, Bun or Python version.
      placeholder: "Python 3.12.4"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected to happen
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What actually happened
      description: Include the full error and stack trace if there is one.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: The smallest snippet that reproduces it. This matters more than the description.
      render: shell
    validations:
      required: true
