name: Feature request
description: Propose a change to the SDKs
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        These SDKs are **pure protocol clients**. Framework adapters, server
        components and UI helpers are out of scope — but say so anyway and we
        will point you at the right place.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation, not the solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like the SDK to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried or considered instead?
  - type: checkboxes
    id: protocol
    attributes:
      label: Protocol impact
      options:
        - label: This would require a change to the wire protocol (a new field, method or header)
        - label: This can be done entirely client-side with the protocol as it stands
