name: Release — npm

on:
  push:
    tags: ["typescript-v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish @helixsdk/core
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.1.38"
      - uses: actions/setup-node@v4
        with:
          # Node 24 ships npm 11.x, which already clears the >= 11.5.1 that
          # trusted publishing needs. Do NOT drop this to 22.14: that is only
          # the bare minimum for trusted publishing, and current npm releases
          # require ^22.22.2 || ^24.15.0 || >=26.0.0, so `npm install -g
          # npm@latest` fails there with EBADENGINE.
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Show toolchain versions
        run: |
          node --version
          npm --version
      - run: bun install --frozen-lockfile
      - run: bun run --filter '@helixsdk/core' typecheck
      - run: bun run --filter '@helixsdk/core' build
      - name: Tag must match package version
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: packages/typescript
        run: |
          tag="${GITHUB_REF#refs/tags/typescript-v}"
          pkg=$(node -p "require('./package.json').version")
          echo "tag=$tag package=$pkg"
          [ "$tag" = "$pkg" ] || { echo "::error::tag $tag does not match package version $pkg"; exit 1; }
      # Works both ways with no edit:
      #   - NPM_TOKEN set   -> classic/granular token auth (needed for the FIRST
      #     publish, because a trusted publisher can only be configured on a
      #     package that already exists)
      #   - NPM_TOKEN unset -> OIDC trusted publishing via id-token: write
      # Once the first version is live, configure the trusted publisher at
      # npmjs.com (org evigauge-org, repo helix-sdk, workflow release-npm.yml,
      # environment release), then DELETE the NPM_TOKEN secret and the token.
      - name: Publish
        working-directory: packages/typescript
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
