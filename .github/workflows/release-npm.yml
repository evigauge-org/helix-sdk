name: Release — npm

on:
  push:
    tags: ["typescript-v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish @helixsdk/core
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.1.38"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - run: bun install --frozen-lockfile
      - run: bun run --filter '@helixsdk/core' typecheck
      - run: bun run --filter '@helixsdk/core' build
      - name: Tag must match package version
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: packages/typescript
        run: |
          tag="${GITHUB_REF#refs/tags/typescript-v}"
          pkg=$(node -p "require('./package.json').version")
          echo "tag=$tag package=$pkg"
          [ "$tag" = "$pkg" ] || { echo "::error::tag $tag does not match package version $pkg"; exit 1; }
      - name: Publish
        working-directory: packages/typescript
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
