[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "helixsdk"
version = "0.1.0a0"
description = "Python client SDK for the Agent Execution Protocol (AEP), the wire protocol behind Helix."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Evigauge Technologies Pvt. Ltd.", email = "info@evigauge.com" }]
keywords = ["helix", "aep", "agent", "agent-execution-protocol", "sdk", "client"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.8",
]

[project.urls]
Homepage = "https://github.com/evigauge-org/helix-sdk"
Repository = "https://github.com/evigauge-org/helix-sdk"
Issues = "https://github.com/evigauge-org/helix-sdk/issues"

[project.optional-dependencies]
dev = [
    "datamodel-code-generator>=0.26",
    "ruff>=0.7",
]

[tool.hatch.build.targets.wheel]
packages = ["helix_sdk"]

[tool.ruff]
line-length = 100
target-version = "py311"
